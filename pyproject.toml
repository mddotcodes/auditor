[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "auditor"
version = "0.0.1"
description = "Isolated execution engine for automated EVM smart contract analysis"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "Auditor contributors" },
]
keywords = ["solidity", "ethereum", "security", "slither", "foundry", "audit"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1",
  "pytest-cov>=6.0",
  "ruff>=0.9",
  "mypy>=1.14",
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "openapi-spec-validator>=0.7",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/md/auditor"
Repository = "https://github.com/md/auditor"
Issues = "https://github.com/md/auditor/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/auditor"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/schemas",
  "/README.md",
  "/LICENSE",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["auditor"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
show_error_codes = true
mypy_path = "src"
packages = ["auditor"]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]
filterwarnings = [
  "error",
]
